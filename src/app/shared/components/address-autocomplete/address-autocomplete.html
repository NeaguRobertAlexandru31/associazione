<div class="relative">
  @if (variant() === 'public') {
    <input type="text"
           [value]="query()"
           (input)="onInput($any($event.target).value)"
           placeholder="Cerca indirizzo…"
           autocomplete="off"
           class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface font-inter text-sm focus:outline-none focus:border-primary transition-colors placeholder:text-on-surface-variant/40" />
  } @else {
    <input type="text"
           [value]="query()"
           (input)="onInput($any($event.target).value)"
           placeholder="Cerca indirizzo…"
           autocomplete="off"
           class="form-input" />
  }

  @if (loading()) {
    <span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-base text-on-surface-variant/50 spin">
      progress_activity
    </span>
  }

  @if (open() && results().length) {
    <ul class="absolute z-50 left-0 right-0 mt-1 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden max-h-56 overflow-y-auto">
      @for (r of results(); track r.place_id) {
        <li (click)="select(r)"
            class="px-4 py-2.5 font-inter text-sm text-on-surface hover:bg-surface-container cursor-pointer transition-colors leading-snug">
          {{ label(r) }}
        </li>
      }
    </ul>
  }
</div>
