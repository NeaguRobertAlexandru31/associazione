<a [routerLink]="['/news', article().id]"
   class="group relative flex flex-col h-full bg-[#faf8f3] border border-neutral-800/20 hover:border-neutral-800/50 transition-colors duration-300"
   style="box-shadow: 2px 2px 0 0 rgba(0,0,0,0.08)">

  <!-- Testata stile masthead -->
  <div class="flex items-center justify-between px-3 py-1.5 border-b border-neutral-800/20 bg-neutral-800/5">
    @if (firstCategory()) {
      <span class="font-inter font-black text-[9px] uppercase tracking-[0.2em] text-neutral-600">
        {{ firstCategory() }}
      </span>
    } @else {
      <span class="font-inter font-black text-[9px] uppercase tracking-[0.2em] text-neutral-400">Notizie</span>
    }
    <span class="font-inter text-[9px] text-neutral-400">{{ formatDate() }}</span>
  </div>

  <!-- Immagine con proporzione giornale -->
  <div class="aspect-[3/2] overflow-hidden bg-neutral-200 flex-shrink-0">
    <img [src]="coverImage()" [alt]="article().name"
         class="w-full h-full object-cover grayscale-[0.15] group-hover:grayscale-0 group-hover:scale-[1.02] transition-all duration-500"
         loading="lazy" />
  </div>

  <!-- Contenuto tipografico -->
  <div class="p-4 flex flex-col flex-1">
    <!-- Linea decorativa -->
    <div class="flex items-center gap-2 mb-3">
      <div class="h-px flex-1 bg-neutral-800/25"></div>
      <div class="w-1 h-1 rounded-full bg-neutral-800/40"></div>
      <div class="h-px flex-1 bg-neutral-800/25"></div>
    </div>

    <h3 class="font-romania font-extrabold text-neutral-900 text-base leading-snug mb-2 line-clamp-3">
      {{ article().name }}
    </h3>

    <p class="font-inter text-neutral-600 text-[11px] leading-relaxed flex-1 line-clamp-3">
      {{ previewText() }}
    </p>

    <!-- Footer link stile giornale -->
    <div class="mt-3 pt-2 border-t border-neutral-800/15 flex justify-end">
      <span class="font-inter font-bold text-[10px] uppercase tracking-widest text-neutral-700 group-hover:text-primary transition-colors">
        Leggi →
      </span>
    </div>
  </div>
</a>
