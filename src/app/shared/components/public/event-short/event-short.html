<!-- Mobile: card con sfondo immagine e gradiente -->
<a [routerLink]="event().slug ? ['/events', event().slug] : ['/events']"
   class="block sm:hidden relative rounded-2xl overflow-hidden aspect-[16/9] shadow-sm"
   [style.background-image]="'url(' + coverImg() + ')'"
   style="background-size: cover; background-position: center">
  <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent"></div>

  <!-- Badge data in alto a sinistra -->
  <div class="absolute top-3 left-3 bg-secondary text-white font-romania font-bold text-xs px-2.5 py-1 rounded-full">
    {{ day() }} {{ month() }}
  </div>

  <!-- Contenuto in basso -->
  <div class="absolute inset-x-0 bottom-0 p-4">
    <div class="flex items-end justify-between gap-3">
      <div>
        <h3 class="font-romania font-bold text-white text-lg leading-tight">{{ event().name }}</h3>
        <div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 mt-1 text-white/90 font-inter text-xs">
          <span class="flex items-center gap-1">
            <span class="material-symbols-outlined text-xs">location_on</span>
            {{ event().location }}
          </span>
          <span class="flex items-center gap-1">
            <span class="material-symbols-outlined text-xs">schedule</span>
            {{ event().time }}
          </span>
        </div>
      </div>
      <span class="flex-shrink-0 flex items-center text-white">
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </span>
    </div>
  </div>
</a>

<!-- Desktop: layout orizzontale originale -->
<a [routerLink]="event().slug ? ['/events', event().slug] : ['/events']"
   class="hidden sm:flex sm:items-center gap-4 bg-surface-container-lowest rounded-2xl px-5 py-5 shadow-sm border-l-4 hover:shadow-md transition-shadow"
   [class]="accentClass()">
  <div class="flex items-center gap-4 flex-1 min-w-0">
    <div class="text-center min-w-[3rem] flex-shrink-0">
      <div class="font-romania font-extrabold text-primary text-3xl leading-none">{{ day() }}</div>
      <div class="font-inter font-semibold text-on-surface-variant text-xs uppercase tracking-wider mt-0.5">{{ month() }}</div>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="font-romania font-bold text-primary text-lg leading-tight">{{ event().name }}</h3>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-1 text-on-surface-variant font-inter text-sm">
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">location_on</span>
          {{ event().location }}
        </span>
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">schedule</span>
          {{ event().time }}
        </span>
      </div>
    </div>
  </div>
  <span class="self-center flex items-center gap-1 font-inter font-semibold text-sm text-primary flex-shrink-0">
    {{ 'home.event_1_btn' | translate }}
    <span class="material-symbols-outlined text-base">arrow_forward</span>
  </span>
</a>
