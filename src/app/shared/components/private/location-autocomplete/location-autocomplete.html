<div class="relative w-full">

  <div class="relative">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-base text-on-surface-variant pointer-events-none"
          style="font-variation-settings:'FILL' 1">location_on</span>
    <input
      type="text"
      [value]="value()"
      (input)="onInput($any($event.target).value)"
      placeholder="Es. Sala Riunioni, Milano"
      class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-surface-container border border-outline-variant/30 font-inter text-sm text-on-surface placeholder:text-on-surface-variant/50 outline-none focus:ring-2 focus:ring-primary/30 transition-all" />
    @if (loading()) {
      <span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-base text-on-surface-variant spin">progress_activity</span>
    }
  </div>

  @if (open() && suggestions().length > 0) {
    <div class="absolute z-50 mt-1 w-full bg-surface rounded-2xl shadow-xl border border-outline-variant/20 py-1 overflow-hidden">
      @for (s of suggestions(); track s) {
        <button type="button" (click)="select(s)"
                class="w-full flex items-center gap-2.5 px-3 py-2.5 hover:bg-surface-container transition-colors text-left">
          <span class="material-symbols-outlined text-sm text-on-surface-variant flex-shrink-0">location_on</span>
          <span class="font-inter text-sm text-on-surface truncate">{{ s }}</span>
        </button>
      }
    </div>
  }

</div>
