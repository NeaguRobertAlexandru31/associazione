<div class="relative w-full">

  <!-- Input trigger -->
  <button type="button" (click)="toggle()"
          class="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl bg-surface-container border border-outline-variant/30 font-inter text-sm text-on-surface outline-none focus:ring-2 focus:ring-primary/30 transition-all text-left">
    <span class="material-symbols-outlined text-base text-on-surface-variant" style="font-variation-settings:'FILL' 1">schedule</span>
    @if (displayValue()) {
      <span>{{ displayValue() }}</span>
    } @else {
      <span class="text-on-surface-variant/50">--:--</span>
    }
  </button>

  <!-- Dropdown ore/minuti -->
  @if (open()) {
    <div class="absolute z-50 mt-1 bg-surface rounded-2xl shadow-xl border border-outline-variant/20 flex overflow-hidden" style="width: 180px">

      <!-- Colonna ore -->
      <div class="flex-1 flex flex-col border-r border-outline-variant/20">
        <div class="font-inter text-[10px] font-semibold text-on-surface-variant/60 uppercase text-center py-2 border-b border-outline-variant/10">Ora</div>
        <div class="overflow-y-auto max-h-52 py-1">
          @for (h of hours; track h) {
            <button type="button" (click)="selectHour(h)"
                    class="w-full px-3 py-1.5 font-inter text-sm text-center transition-colors"
                    [class]="h === selectedHour()
                      ? 'bg-primary text-on-primary font-bold'
                      : 'text-on-surface hover:bg-surface-container'">
              {{ h }}
            </button>
          }
        </div>
      </div>

      <!-- Colonna minuti -->
      <div class="flex-1 flex flex-col">
        <div class="font-inter text-[10px] font-semibold text-on-surface-variant/60 uppercase text-center py-2 border-b border-outline-variant/10">Min</div>
        <div class="py-1">
          @for (m of minutes; track m) {
            <button type="button" (click)="selectMinute(m)"
                    class="w-full px-3 py-1.5 font-inter text-sm text-center transition-colors"
                    [class]="m === selectedMin()
                      ? 'bg-primary text-on-primary font-bold'
                      : 'text-on-surface hover:bg-surface-container'">
              {{ m }}
            </button>
          }
        </div>
      </div>

    </div>
  }

</div>
