<div class="relative w-full">

  <!-- Input trigger -->
  <div class="flex items-center w-full rounded-xl bg-surface-container border border-outline-variant/30 focus-within:ring-2 focus-within:ring-primary/30 transition-all overflow-hidden">
    <input type="text"
           [value]="rawInput()"
           (input)="onManualInput($any($event.target).value)"
           (focus)="openCalendar()"
           [placeholder]="placeholder()"
           maxlength="10"
           class="flex-1 px-3 py-2.5 bg-transparent font-inter text-sm text-on-surface placeholder:text-on-surface-variant/50 outline-none" />
    <button type="button" (click)="toggle()"
            class="px-2.5 flex items-center self-stretch hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined text-base text-on-surface-variant" style="font-variation-settings:'FILL' 1">calendar_today</span>
    </button>
  </div>

  <!-- Dropdown calendario -->
  @if (open()) {
    <div class="absolute z-50 mt-1 w-72 bg-surface rounded-2xl shadow-xl border border-outline-variant/20 p-4">

      <!-- Header navigazione -->
      <div class="flex items-center justify-between mb-3">
        @if (monthView()) {
          <!-- Vista mese: frecce anno -->
          <button type="button" (click)="prevYear()"
                  class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-base text-on-surface-variant">chevron_left</span>
          </button>
          <button type="button" (click)="toggleMonthView()"
                  class="font-inter font-semibold text-sm text-primary hover:underline">
            {{ viewYear() }}
          </button>
          <button type="button" (click)="nextYear()"
                  class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-base text-on-surface-variant">chevron_right</span>
          </button>
        } @else {
          <!-- Vista giorno: frecce mese -->
          <button type="button" (click)="prevMonth()"
                  class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-base text-on-surface-variant">chevron_left</span>
          </button>
          <button type="button" (click)="toggleMonthView()"
                  class="font-inter font-semibold text-sm text-on-surface hover:text-primary transition-colors">
            {{ MONTHS[viewMonth()] }} {{ viewYear() }}
          </button>
          <button type="button" (click)="nextMonth()"
                  class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-base text-on-surface-variant">chevron_right</span>
          </button>
        }
      </div>

      <!-- Vista mese: griglia 12 mesi -->
      @if (monthView()) {
        <div class="grid grid-cols-3 gap-1.5">
          @for (m of MONTHS; track $index) {
            <button type="button" (click)="selectMonth($index)"
                    [ngClass]="{
                      'bg-primary text-on-primary font-bold': $index === viewMonth(),
                      'hover:bg-surface-container text-on-surface': $index !== viewMonth()
                    }"
                    class="py-2 rounded-lg font-inter text-xs transition-colors">
              {{ m.slice(0, 3) }}
            </button>
          }
        </div>

      } @else {
        <!-- Vista giorno -->

        <!-- Intestazione giorni -->
        <div class="grid grid-cols-7 mb-1">
          @for (d of DAYS; track d) {
            <div class="text-center font-inter text-[10px] font-semibold text-on-surface-variant/60 uppercase py-1">{{ d }}</div>
          }
        </div>

        <!-- Celle giorni -->
        <div class="grid grid-cols-7 gap-y-0.5">
          @for (day of cells(); track $index) {
            <button type="button"
                    [disabled]="!day"
                    (click)="select(day)"
                    [ngClass]="{
                      'bg-primary text-on-primary font-bold': day === selectedDay(),
                      'bg-primary/10 text-primary font-semibold': isToday(day) && day !== selectedDay(),
                      'hover:bg-surface-container text-on-surface cursor-pointer': !!day && day !== selectedDay(),
                      'pointer-events-none invisible': !day
                    }"
                    class="h-8 w-full rounded-lg font-inter text-sm transition-colors flex items-center justify-center">
              {{ day ?? '' }}
            </button>
          }
        </div>

      }

    </div>
  }

</div>
