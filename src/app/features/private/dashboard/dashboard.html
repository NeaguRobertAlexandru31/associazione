<div class="min-h-screen bg-surface-container-low">

  <!-- Navbar fissa -->
  <header class="fixed top-0 left-0 right-0 z-50 h-16 flex items-center gap-2 px-5">

    <!-- Box associazione → dashboard -->
    <a routerLink="/dashboard/overview" class="flex items-center gap-2.5 bg-surface/90 backdrop-blur-md px-3 py-2 rounded-2xl shadow-lg border border-outline-variant/15 hover:bg-surface transition-colors">
      <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0 overflow-hidden">
        @if (assocLogo()) {
          <img [src]="assocLogo()" alt="" class="w-full h-full object-cover" />
        } @else {
          <span class="material-symbols-outlined text-on-primary text-[18px]" style="font-variation-settings:'FILL' 1">
            account_balance
          </span>
        }
      </div>
      @if (assocName()) {
        <span class="font-inter font-semibold text-on-surface text-sm leading-tight">{{ assocName() }}</span>
      }
    </a>

    <!-- Box utente → impostazioni -->
    @if (fabUser(); as u) {
      <a routerLink="/dashboard/settings" class="flex items-center gap-2.5 bg-surface/90 backdrop-blur-md px-3 py-2 rounded-2xl shadow-lg border border-outline-variant/15 hover:bg-surface transition-colors">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0 overflow-hidden">
          @if (u.profileImage) {
            <img [src]="u.profileImage" alt="" class="w-full h-full object-cover" />
          } @else {
            <span class="font-romania font-bold text-on-primary text-xs">{{ u.name[0] }}</span>
          }
        </div>
        <div class="flex flex-col">
          <span class="font-inter font-semibold text-on-surface text-sm leading-tight">{{ u.name }}</span>
          <span class="font-inter text-on-surface-variant text-[11px] leading-tight">{{ u.email }}</span>
        </div>
      </a>
    }

    <!-- Spacer + bottone menu a destra -->
    <div class="ml-auto">
      <app-dash-fab
        [items]="navItems()"
        [user]="fabUser()"
        (logoutClick)="logout()" />
    </div>

  </header>

  <main class="p-6 pt-20 md:p-10 md:pt-20">
    <router-outlet />
  </main>
</div>
