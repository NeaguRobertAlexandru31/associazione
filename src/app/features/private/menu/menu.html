<div class="dash-content max-w-5xl mx-auto">

  <div class="mb-10">
    <h1 class="font-romania font-extrabold text-primary text-3xl tracking-tight">Menu</h1>
    <p class="font-inter text-on-surface-variant text-sm mt-1">Seleziona una sezione del pannello</p>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    @for (item of items(); track item.route) {
      <a [routerLink]="item.route"
         class="menu-card group relative flex flex-col items-center justify-center gap-3 p-6 rounded-2xl bg-white border border-outline-variant/20 transition-all duration-200 cursor-pointer hover:shadow-md hover:-translate-y-0.5"
         [style.--hover-bg]="item.colors.bg"
         [style.--hover-border]="item.colors.border"
         [style.--icon-color]="item.colors.icon">

        <span class="material-symbols-outlined text-4xl text-on-surface-variant menu-icon transition-colors duration-200"
              style="font-variation-settings:'FILL' 1">
          {{ item.icon }}
        </span>

        <span class="font-inter font-semibold text-sm text-on-surface text-center leading-tight">
          {{ item.label }}
        </span>

        @if (item.badge && item.badge > 0) {
          <span class="absolute top-3 right-3 bg-secondary text-on-primary font-inter font-bold text-[10px] px-1.5 py-0.5 rounded-full min-w-[18px] text-center">
            {{ item.badge }}
          </span>
        }
      </a>
    }
  </div>

  <!-- Azioni in fondo -->
  <div class="flex gap-3 mt-10 pt-8 border-t border-outline-variant/20">
    <a href="/" target="_blank" rel="noopener"
       class="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-outline-variant/40 font-inter font-semibold text-sm text-on-surface hover:bg-surface-container transition-colors">
      <span class="material-symbols-outlined text-base text-on-surface-variant" style="font-variation-settings:'FILL' 1">language</span>
      Vai al sito
    </a>
    <button (click)="logout()"
            class="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-error/30 font-inter font-semibold text-sm text-error hover:bg-error/8 transition-colors">
      <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">logout</span>
      Esci
    </button>
  </div>

</div>
