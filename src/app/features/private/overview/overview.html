<div class="dash-content">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-[#002068]">Panoramica</h1>
    <p class="text-sm text-[#444653] mt-1">Benvenuto nel pannello di controllo.</p>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-8">
    @for (s of stats(); track s.label) {
      <app-metric-card
        [icon]="s.icon"
        [label]="s.label"
        [value]="s.value"
        [delta]="s.delta"
        [positive]="s.positive"
        [loading]="s.loading" />
    }
  </div>

  <!-- Activity -->
  <div>
    <app-recents [limit]="5" />
  </div>
</div>
